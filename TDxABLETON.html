<!DOCTYPE html>
<html lang="es">

<head>
  <meta http-equiv="content-type" content="text/html" charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="unglitchonline">
  <link href="styles/style_main.css" rel="stylesheet" type="text/css">
  <title>Confirmación Taller: TouchDesigner meets Ableton</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 24px;
    }

    p.subtitle {
      margin: 0 0 24px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }

    .status-msg.error {
      display: block;

      border: 1px solid rgba(248, 81, 73, 0.4);
    }

    .status-msg.success {
      display: block;

      border: 1px solid rgba(46, 160, 67, 0.4);
    }

    .status-msg.info {
      display: block;
      border: 1px solid rgba(56, 139, 253, 0.4);
    }
  </style>
</head>

<body>

  <div class="card">
    <span class="tag">Taller Gratuito</span>
    <h2>TouchDesigner meets Ableton</h2>
    <p class="subtitle">Confirma tu asistencia antes del viernes 31 de julio a las 10:00 hrs (CDMX).</p>

    <div class="form-group">
      <label for="emailInput">Ingresa el mismo correo electrónico que registraste en el formulario:</label>
      <input type="email" id="emailInput" placeholder="tu.correo@ejemplo.com" required>
    </div>

    <div id="statusMsg" class="status-msg"></div>

    <button id="btnConfirm" class="btn btn-confirm" onclick="procesarRespuesta('confirmar')">
      ✓ Confirmar mi asistencia
    </button>

    <button id="btnDecline" class="btn btn-decline" onclick="procesarRespuesta('declinar')">
      ✕ No podré asistir
    </button>

    <button id="btnDrive" class="btn btn-drive" onclick="procesarRespuesta('drive')">
      📁 He confirmado, deseo recibir el material descargable
    </button>
  </div>

  <script src="script/TDxABLETON.js"></script>

</body>

</html>
