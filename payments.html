<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="content-type" content="text/html" charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="unglitchonline">
    <title>/pagos</title>
    <link rel="shortcut icon" href="docs/img/af.png">
    <link href="styles/style_main.css" rel="stylesheet" type="text/css">
    <style>
        .info-container {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 20px;
            display: inline-block;
            text-align: left;
            margin: 20px auto;
            width: 85%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        button {
            position: left;
        }
        .success-message {
            display: none;
            margin-top: 20px;
            color: #ffd6ff;
            font-size: 1rem;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Información para Pagos por SPEI</h1>
    <div class="info-container">
        <p>Institución: <span id="banco">STP</span></p>
        <button onclick="copiarTexto('banco')">Copiar</button>
        <p><strong>Nombre:</strong> <span id="nombre">Nadia Abigail Fuentes Pompa</span></p>
        <button onclick="copiarTexto('nombre')">Copiar</button>
        <p><strong>CLABE:</strong> <span id="clabe">646016206808683075</span></p>
        <button onclick="copiarTexto('clabe')">Copiar</button>
    </div>
    <div id="mensajeExito" class="success-message"></div>

    <script>
        function copiarTexto(id) {
            const texto = document.getElementById(id).innerText;
            const textarea = document.createElement("textarea");
            textarea.value = texto;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            document.body.removeChild(textarea);

            const mensajeExito = document.getElementById("mensajeExito");
            mensajeExito.style.display = "block";
            mensajeExito.innerText = `¡"${texto}" copiado al portapapeles!`;
            setTimeout(() => {
                mensajeExito.style.display = "none";
            }, 3000);
        }
    </script>
</body>
</html>
