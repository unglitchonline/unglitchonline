<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html" charset="UTF-8">
    <meta name="author" content="unglitchonline">
    <title>/touchdesigner</title>
    <link href="styles/style_main.css" rel="stylesheet" type="text/css">
    <link rel="shortcut icon" href="docs/img/af.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        h1,
        h2,
        h3 {
            text-align: left;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
        }

        .content a {
            position: relative;
            z-index: 2;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            height: 560px;
            border-radius: 32px;
            overflow: hidden;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: grab;
        }

        .carousel-container:active {
            cursor: grabbing;
        }

        .carousel-scene {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1800px;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-card {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 300px;
            height: 380px;
            border-radius: 20px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 12px 28px #ffffff;
            will-change: transform, filter, opacity;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .carousel-card img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .card-caption {
            flex: 0 0 auto;
            display: block;
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            line-height: 1.25;
            text-align: center;
            color: rgba(0, 0, 0, 0.45);
            background: #ffffff;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .info-badge {
            position: absolute;
            bottom: 20px;
            right: 24px;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.45);
            background: #ffffff;
            /* backdrop-filter: blur(8px); */
            padding: 6px 14px;
            border-radius: 40px;
            pointer-events: none;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        @media (max-width: 640px) {
            .carousel-container {
                height: 440px;
                border-radius: 20px;
            }

            .carousel-card {
                width: 220px;
                height: 290px;
            }

            .card-caption {
                padding: 9px 12px;
                font-size: 12px;
            }
        }

        @media (min-width: 641px) and (max-width: 1024px) {
            .carousel-card {
                width: 260px;
                height: 340px;
            }
        }
    </style>
</head>
<body>
    <div class="carousel-container" id="carousel" role="region" aria-label="Carrusel 3D infinito" tabindex="0">
        <div class="carousel-scene" id="scene"></div>
    </div>
    <div class="info-badge">click para descargar archivo .toe</div>
    <script src="tdcards.js"></script>
</body>

</html>
